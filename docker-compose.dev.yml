services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_DB: enigma_dev, POSTGRES_USER: enigma, POSTGRES_PASSWORD: enigma_dev }
    ports: ["5432:5432"]
    volumes: ["pg_dev:/var/lib/postgresql/data"]
  pgadmin:
    image: dpage/pgadmin4:9
    environment: { PGADMIN_DEFAULT_EMAIL: admin@admin.com, PGADMIN_DEFAULT_PASSWORD: admin }
    ports: ["5050:80"]
    depends_on: [postgres]
volumes: { pg_dev: {} }
